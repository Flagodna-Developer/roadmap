<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{INTRO}}" />
    <meta name="theme-color" content="#000503" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.flagodna.com/favicon/flagodna/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="https://cdn.flagodna.com/favicon/flagodna/favicon-96x96.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://cdn.flagodna.com/favicon/flagodna/apple-touch-icon.png"
    />

    <style>
      {{STYLES}}
    </style>
  </head>
  <body>
    <header class="topbar">{{TOPBAR}}</header>

    <div class="frame">
      <header class="mast">
        <h1>{{TITLE}}</h1>
        <p class="intro">{{INTRO}}</p>
      </header>

      <main class="board">{{COLUMNS}}</main>

      <footer class="colophon">
        <div class="colophon-row"><span>updated {{STAMP}}</span></div>
        <p class="signoff">
          <b>FlagoDNA Developer Labs</b>
          <span class="sep">·</span>
          <a href="https://flagodna.com/founder-story/#mlampah-ing-tresno"
            >Mlampah Ing Tresno ❤️</a
          >
        </p>
      </footer>
    </div>
  </body>
</html>
